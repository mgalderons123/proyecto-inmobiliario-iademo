name: casarent-production

services:
  db:
    image: postgres:16-alpine
    env_file: .env.production
    entrypoint: ["/bin/sh", "/opt/postgres-production-entrypoint.sh"]
    volumes:
      - production_postgres:/var/lib/postgresql/data
      - ./production-data/tls:/run/certs:ro
      - ./scripts/postgres-production-entrypoint.sh:/opt/postgres-production-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [backend]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - production_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [backend]

  web:
    build:
      context: .
      dockerfile: Dockerfile.production
    image: casarent-production:local
    env_file: .env.production
    volumes:
      - production_public_media:/app/data/public
      - production_private_media:/app/data/private
      - production_static:/app/staticfiles
      - ./production-data/tls/server.crt:/run/certs/server.crt:ro
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health/', headers={'Host':'casarent.app','X-Forwarded-Proto':'https'}); urllib.request.urlopen(r, timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks: [backend, frontend]

  gateway:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:4200:8080"]
    volumes:
      - ./deploy/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
      - production_public_media:/srv/public:ro
    depends_on:
      web: {condition: service_healthy}
    restart: unless-stopped
    networks: [frontend]

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [public]
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/secrets/tunnel_token"]
    secrets: [tunnel_token]
    depends_on:
      gateway: {condition: service_started}
    restart: unless-stopped
    networks: [frontend]

secrets:
  tunnel_token:
    file: ./production-data/tunnel-token

networks:
  backend: {internal: true}
  frontend: {}

volumes:
  production_postgres:
  production_redis:
  production_public_media:
  production_private_media:
  production_static:
