{% if field.is_hidden %}
  {{ field }}
{% else %}
  <div class="form__field{% if field.errors %} form__field--error{% endif %}">
    <label class="form__label" for="{{ field.id_for_label }}">
      {{ field.label }}
      {% if field.field.required %}<span class="form__required" aria-hidden="true">*</span>{% endif %}
    </label>
    {{ field }}
    {% if field.help_text %}
      <span class="form__help" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</span>
    {% endif %}
    {% if field.errors %}
      <div class="form__error" id="{{ field.auto_id }}_error" role="alert">{{ field.errors|join:" " }}</div>
    {% endif %}
  </div>
{% endif %}
