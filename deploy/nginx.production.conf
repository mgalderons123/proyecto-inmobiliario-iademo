map $http_cf_connecting_ip $casarent_client_ip {
    "" $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 8080;
    server_name casarent.app www.casarent.app;
    client_max_body_size 25m;
    server_tokens off;
    access_log off;

    location /media/ {
        alias /srv/public/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $casarent_client_ip;
        proxy_set_header X-Forwarded-For $casarent_client_ip;
        proxy_read_timeout 65s;
    }
}
